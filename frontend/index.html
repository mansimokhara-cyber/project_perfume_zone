        const selectedSizeObj = product.sizes ? product.sizes.find(s => s.size === size) : null;

        const cartItemId = `${product.id}-${size}`;

        setItems(prevItems => {
          const existing = prevItems.find(i => i.cartItemId === cartItemId);
          if (existing) {
            return prevItems.map(i =>
              i.cartItemId === cartItemId ? { ...i, quantity: i.quantity + quantity } : i

          }
          return [

            {
              cartItemId,
              id: product.id,
              name: product.name,
              subtitle: `${size} ${product.subtitle || 'Eau de Parfum'}`,

              price,
              quantity,
              image: product.image

        if (newQty <= 0) {
          removeFromCart(cartItemId);
          return;
        }
        setItems(prev => prev.map(item => item.cartItemId === cartItemId ? { ...item, quantity: newQty } : item));

          setPromoError('');

        } else if (trimmed === 'GOLD20' || trimmed === 'VIP20') {

        setAppliedPromo(null);
        setDiscountPercent(0);
        setPromoError('');

      const rawSubtotal = items.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const discountAmount = Math.round((rawSubtotal * discountPercent) / 100);
      const subtotal = Math.max(0, rawSubtotal - discountAmount);
      const remainingForFreeShipping = Math.max(0, FREE_SHIPPING_THRESHOLD - subtotal);
      const freeShippingProgress = Math.min(100, (subtotal / FREE_SHIPPING_THRESHOLD) * 100);

      return (
        <CartContext.Provider
          value={{
            items,
            addToCart,
            updateQuantity,
            removeFromCart,
            clearCart,
            isCartOpen,
            openCart: () => setIsCartOpen(true),
            closeCart: () => setIsCartOpen(false),
            totalItemsCount,
            rawSubtotal,
            discountAmount,
            subtotal,
            appliedPromo,
            applyPromo,

                          <div className="flex justify-between">
                            <h3 className="font-headline-md text-lg text-primary">{item.name}</h3>
                            <span className="font-headline-md text-lg text-primary font-bold">${item.price * item.quantity}</span>
                          </div>
                          <p className="font-body-md text-xs text-on-surface-variant">{item.subtitle}</p>
                        </div>
                        <div className="flex justify-between items-center mt-4">
                          <div className="flex items-center gap-3 border border-outline-variant/40 px-3 py-1">
                            <button onClick={() => updateQuantity(item.cartItemId, item.quantity - 1)} className="text-on-surface-variant hover:text-primary">
                              <span className="material-symbols-outlined text-xs">remove</span>
                            </button>
                            <span className="font-body-md text-xs font-semibold w-4 text-center">{item.quantity}</span>
                            <button onClick={() => updateQuantity(item.cartItemId, item.quantity + 1)} className="text-on-surface-variant hover:text-primary">
                              <span className="material-symbols-outlined text-xs">add</span>
                            </button>
                          </div>
                          <button onClick={() => removeFromCart(item.cartItemId)} className="font-label-caps text-xs text-on-surface-variant hover:text-error uppercase tracking-wider">
                            Remove
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              <div className="lg:col-span-5">
                <div className="bg-surface-container-lowest border border-outline-variant/20 p-8 space-y-6">
                  <h2 className="font-headline-md text-xl text-primary border-b border-outline-variant/20 pb-4">Order Summary</h2>
                  <div className="flex justify-between items-end">
                    <span className="font-headline-md text-base text-primary uppercase">Total</span>
                    <span className="font-headline-md text-2xl text-primary font-bold">${subtotal}</span>
                  </div>
                  <button
                    onClick={() => { setOrderComplete(true); clearCart(); addToast('Order confirmed!', 'success'); }}
                    className="w-full bg-secondary text-on-secondary py-4 font-button text-xs uppercase tracking-widest hover:bg-primary transition-colors"
                  >
                    Proceed to Checkout
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const QuizPage = ({ onSelectProduct, onNavigateToCollections }) => {
      return (
        <div className="flex-grow pt-24 pb-20">
          <div className="container mx-auto max-w-container-max px-margin-mobile md:px-margin-desktop mb-8">
            <div className="text-center max-w-2xl mx-auto">
              <p className="font-label-caps text-xs text-secondary tracking-widest uppercase mb-2">PRIVATE CONSULTATION</p>
              <h1 className="font-display-lg-mobile md:font-display-lg text-primary mb-4">Bespoke Scent Finder</h1>
              <p className="font-body-lg text-sm text-on-surface-variant leading-relaxed">
                Discover your signature olfactory match tailored by master perfumers.
              </p>
            </div>
          </div>
          <HomePage onNavigate={onNavigateToCollections} onSelectProduct={onSelectProduct} onQuickView={()=>{}} />
        </div>
      );
    };

    // --- MAIN APP ---
    const App = () => {
      const [currentPage, setCurrentPage] = useState('home');
      const [selectedProductId, setSelectedProductId] = useState('velvet-amber-oudh');
      const [quickViewProduct, setQuickViewProduct] = useState(null);

      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [currentPage, selectedProductId]);

      return (
        <ToastProvider>
          <CartProvider>
            <div className="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col">
              <Header currentPage={currentPage} onNavigate={setCurrentPage} />
              <main className="flex-grow flex flex-col">
                {currentPage === 'home' && (
                  <HomePage
                    onNavigate={setCurrentPage}
                    onSelectProduct={(id) => { setSelectedProductId(id); setCurrentPage('product'); }}
                    onQuickView={setQuickViewProduct}
                  />
                )}
                {currentPage === 'collections' && (
                  <CollectionsPage
                    onSelectProduct={(id) => { setSelectedProductId(id); setCurrentPage('product'); }}
                    onQuickView={setQuickViewProduct}
                  />
                )}
                {currentPage === 'product' && (
                  <ProductDetailPage
                    productId={selectedProductId}
                    onBack={() => setCurrentPage('collections')}
                    onSelectProduct={(id) => { setSelectedProductId(id); setCurrentPage('product'); }}
                    onQuickView={setQuickViewProduct}
                  />
                )}
                {currentPage === 'cart' && (
                  <CartPage
                    onNavigateToHome={() => setCurrentPage('home')}
                    onNavigateToCollections={() => setCurrentPage('collections')}
                  />
                )}
                {currentPage === 'quiz' && (
                  <QuizPage
                    onSelectProduct={(id) => { setSelectedProductId(id); setCurrentPage('product'); }}
                    onNavigateToCollections={() => setCurrentPage('collections')}
                  />
                )}
              </main>
              <Footer onNavigate={setCurrentPage} />
              <BottomNav currentPage={currentPage} onNavigate={setCurrentPage} />
              <CartDrawer
                onNavigateToProduct={(id) => { setSelectedProductId(id); setCurrentPage('product'); }}
                onNavigateToCheckout={() => setCurrentPage('cart')}
              />
              {quickViewProduct && (
                <QuickViewModal
                  product={quickViewProduct}
                  onClose={() => setQuickViewProduct(null)}
                  onNavigateToProduct={(id) => { setQuickViewProduct(null); setSelectedProductId(id); setCurrentPage('product'); }}
                />
              )}
              <ToastContainer />
            </div>
          </CartProvider>
        </ToastProvider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
